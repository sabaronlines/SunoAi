<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANOJ MUSIC STUDIO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #fff5f9 0%, #ffe4f1 50%, #ffffff 100%);
            color: #1e1b2e;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Music Notes Background Animation */
        .music-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .note {
            position: absolute;
            bottom: -50px;
            color: #ff1493;
            font-size: 22px;
            opacity: 0;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
            animation: floatNotes 9s linear infinite;
        }
        .note:nth-child(1) { left: 8%; font-size: 20px; animation-delay: 0s; animation-duration: 8s; }
        .note:nth-child(2) { left: 22%; font-size: 28px; animation-delay: 2s; animation-duration: 10s; color: #ff69b4; }
        .note:nth-child(3) { left: 38%; font-size: 18px; animation-delay: 4s; animation-duration: 7.5s; }
        .note:nth-child(4) { left: 54%; font-size: 26px; animation-delay: 1s; animation-duration: 9.5s; color: #ec4899; }
        .note:nth-child(5) { left: 70%; font-size: 22px; animation-delay: 3.5s; animation-duration: 8.5s; }
        .note:nth-child(6) { left: 84%; font-size: 30px; animation-delay: 5s; animation-duration: 11s; color: #ff1493; }
        .note:nth-child(7) { left: 93%; font-size: 19px; animation-delay: 2.5s; animation-duration: 9s; }

        @keyframes floatNotes {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.75; }
            80% { opacity: 0.65; }
            100% { transform: translateY(-108vh) rotate(360deg) scale(1.25); opacity: 0; }
        }

        /* Main Studio Glass Card (White Pink Neon) */
        .app-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 2px solid #ff1493;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.28), inset 0 0 12px rgba(255, 105, 180, 0.15);
            border-radius: 18px;
            padding: 18px;
            margin-top: 6px;
        }

        /* Hacker Style Glitch Logo Animation */
        .header {
            text-align: center;
            margin-bottom: 14px;
            padding: 8px 4px;
            border-bottom: 1px dashed rgba(255, 20, 147, 0.35);
        }
        .hacker-logo {
            position: relative;
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ff1493;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 20, 147, 0.55), 0 0 18px rgba(255, 105, 180, 0.4);
            animation: hackerPulse 2.5s infinite alternate;
        }
        .hacker-logo::before,
        .hacker-logo::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .hacker-logo::before {
            left: 2px;
            text-shadow: -2px 0 #00e5ff;
            clip-path: inset(20% 0 45% 0);
            animation: glitchAnim1 2.2s infinite linear alternate-reverse;
        }
        .hacker-logo::after {
            left: -2px;
            text-shadow: 2px 0 #ff007f;
            clip-path: inset(55% 0 15% 0);
            animation: glitchAnim2 1.8s infinite linear alternate-reverse;
        }

        @keyframes hackerPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.15); }
        }
        @keyframes glitchAnim1 {
            0% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
            25% { clip-path: inset(50% 0 20% 0); transform: translate(2px, -1px); }
            50% { clip-path: inset(30% 0 40% 0); transform: translate(-1px, 2px); }
            75% { clip-path: inset(75% 0 5% 0); transform: translate(2px, 0px); }
            100% { clip-path: inset(15% 0 60% 0); transform: translate(-2px, -1px); }
        }
        @keyframes glitchAnim2 {
            0% { clip-path: inset(65% 0 10% 0); transform: translate(2px, -1px); }
            30% { clip-path: inset(15% 0 65% 0); transform: translate(-2px, 1px); }
            60% { clip-path: inset(45% 0 30% 0); transform: translate(1px, -2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, 2px); }
        }

        .header p {
            color: #d6006e;
            font-size: 11px;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .cursor-blink { animation: blink 0.9s infinite; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        /* API Key Bar */
        .api-bar {
            background: #fff0f7;
            border: 1.5px solid #ff69b4;
            border-radius: 10px;
            padding: 6px 8px;
            margin-bottom: 14px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .api-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #1e1b2e;
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }
        .api-bar input::placeholder { color: #a8557c; }
        .api-bar button {
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 20, 147, 0.35);
        }

        /* Top Tabs */
        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #ffe6f2;
            padding: 5px;
            border-radius: 12px;
            border: 1.5px solid #ff85c0;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 6px;
            border: none;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            background: transparent;
            color: #9d174d;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(90deg, #ff1493, #ec4899);
            color: #ffffff;
            box-shadow: 0 3px 12px rgba(255, 20, 147, 0.45);
        }

        .section-view { display: none; }
        .section-view.active { display: block; }

        /* Modern Upload Bar */
        .modern-upload {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1.5px dashed #ff1493;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.08);
        }
        .modern-upload:active { background: #fff0f7; transform: scale(0.99); }
        .upload-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .upload-icon {
            width: 40px;
            height: 40px;
            background: #ffe4f1;
            border: 1.5px solid #ff1493;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            flex-shrink: 0;
        }
        .upload-details { overflow: hidden; }
        .upload-title {
            font-size: 13.5px;
            font-weight: 800;
            color: #831843;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-sub {
            font-size: 11px;
            color: #db2777;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .browse-pill {
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 8px 13px;
            border-radius: 8px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(255, 20, 147, 0.35);
        }

        /* Auto Filter Cards */
        .filter-title {
            font-size: 12px;
            color: #9d174d;
            font-weight: 800;
            margin-bottom: 9px;
            display: block;
            text-align: center;
        }
        .dual-filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .auto-filter-btn {
            background: #ffffff;
            border: 1.5px solid #ff69b4;
            border-radius: 13px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.1);
        }
        .auto-filter-btn:active { transform: scale(0.97); }
        .auto-filter-btn.active-run {
            background: #fff0f7;
            border-color: #ff1493;
            box-shadow: 0 0 18px rgba(255, 20, 147, 0.45);
        }
        .auto-filter-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .f-badge {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            background: #ffe4f1;
            color: #be185d;
            margin-bottom: 6px;
            font-family: monospace;
        }
        .auto-filter-btn.active-run .f-badge { background: #ff1493; color: #ffffff; }
        .f-name { font-size: 13.5px; font-weight: 900; color: #831843; display: block; }
        .f-desc { font-size: 10.5px; color: #6b7280; font-weight: 600; display: block; margin-top: 4px; line-height: 1.35; }
        .f-tap-hint { margin-top: 8px; font-size: 10px; font-weight: 800; color: #ff1493; font-family: monospace; }

        /* Textareas */
        .field-label {
            color: #9d174d;
            font-weight: 800;
            font-size: 12px;
            display: block;
            margin-bottom: 6px;
        }
        textarea {
            width: 100%;
            height: 125px;
            background-color: #ffffff;
            border: 1.5px solid #ff69b4;
            color: #1e1b2e;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            margin-bottom: 12px;
            font-family: monospace;
            box-shadow: inset 0 2px 6px rgba(255, 20, 147, 0.06);
        }
        textarea:focus { border-color: #ff1493; box-shadow: 0 0 10px rgba(255, 20, 147, 0.25); }
        .style-box { height: 62px; border-color: #ec4899; color: #831843; font-size: 12px; }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-bottom: 10px;
            letter-spacing: 0.4px;
        }
        .btn-ai {
            background: linear-gradient(90deg, #ec4899, #f43f5e);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.35);
        }
        .btn-gen {
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.35);
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
        .btn-dl, .btn-copy {
            background: linear-gradient(90deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-dl { display: none; }
        .status-msg {
            text-align: center;
            font-size: 12px;
            color: #be185d;
            min-height: 20px;
            margin: 8px 0;
            font-family: monospace;
            font-weight: 800;
        }
        audio { width: 100%; margin-top: 6px; margin-bottom: 10px; display: none; border-radius: 8px; }
    </style>
</head>
<body>

<!-- Floating Music Notes Background -->
<div class="music-bg">
    <span class="note">🎵</span>
    <span class="note">🎶</span>
    <span class="note">🎼</span>
    <span class="note">🎧</span>
    <span class="note">🎵</span>
    <span class="note">🎶</span>
    <span class="note">🎹</span>
</div>

<div class="app-box">
    <div class="header">
        <div class="hacker-logo" data-text="MANOJ MUSIC STUDIO">MANOJ MUSIC STUDIO</div>
        <p>[SYSTEM_ACTIVE] |> V6 SPECTRAL BYPASS &amp; JP LYRICS ENGINE<span class="cursor-blink">_</span></p>
    </div>

    <!-- Gemini API Key -->
    <div class="api-bar">
        <input type="password" id="geminiKeyInput" placeholder="Gemini API Key (Auto-Detect के लिए)...">
        <button onclick="saveApiKey()" id="saveKeyBtn">SAVE</button>
    </div>

    <!-- Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabAudioBtn" onclick="switchTab('audio')">🎧 AUTO AUDIO</button>
        <button class="tab-btn" id="tabLyricsBtn" onclick="switchTab('lyrics')">📝 STYLE &amp; LYRICS</button>
    </div>

    <!-- TAB 1: V6 ANTI-FINGERPRINT AUDIO ENGINE -->
    <div id="audioSection" class="section-view active">
        
        <div class="modern-upload" onclick="document.getElementById('audioInput').click()">
            <div class="upload-left">
                <div class="upload-icon">🎵</div>
                <div class="upload-details">
                    <div class="upload-title" id="fileTitle">फ़ोन से गाना चुनें (Full Song)</div>
                    <div class="upload-sub" id="fileSub">Up to 8 Mins • Spectral Fingerprint Bypass</div>
                </div>
            </div>
            <div class="browse-pill">SELECT</div>
        </div>
        <input type="file" id="audioInput" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/mp4,audio/m4a,audio/aac,audio/ogg,audio/*" style="display:none;">

        <span class="filter-title">Suno v6-mini फ़िंगरप्रिंट तोड़ने के लिए फ़िल्टर चुनें:</span>
        
        <div class="dual-filter-grid">
            <!-- Filter 1: Spectral Shift + Allpass + Vocal Focus -->
            <button class="auto-filter-btn" id="btnFilter1" onclick="runAutoPipeline(1)" disabled>
                <span class="f-badge">FILTER #1 • V6 BYPASS</span>
                <span class="f-name">AUTO FILTER #1</span>
                <span class="f-desc">1.085x Pitch + Allpass Sweep + Vocal Focus</span>
                <span class="f-tap-hint">⚡ TAP TO AUTO-DOWNLOAD</span>
            </button>

            <!-- Filter 2: Deep Formant + Time-Jitter Scrambler -->
            <button class="auto-filter-btn" id="btnFilter2" onclick="runAutoPipeline(2)" disabled>
                <span class="f-badge">FILTER #2 • MAX SHIELD</span>
                <span class="f-name">AUTO FILTER #2</span>
                <span class="f-desc">0.905x + Formant Shift + Beat-Grid Jitter</span>
                <span class="f-tap-hint">⚡ TAP TO AUTO-DOWNLOAD</span>
            </button>
        </div>

        <button class="btn btn-ai" id="detectBtn" onclick="autoDetectSong()" disabled>🔍 AUTO-DETECT STYLE &amp; LYRICS</button>

        <div class="status-msg" id="statusBox">पहले ऊपर से अपना गाना सेलेक्ट करें</div>

        <audio id="player" controls playsinline></audio>
        <a class="btn btn-dl" id="dlBtn">⬇️ दोबारा डाउनलोड करें (.WAV)</a>
    </div>

    <!-- TAB 2: JP DIGITAL STYLE HEAVY LYRICS BYPASS -->
    <div id="lyricsSection" class="section-view">
        <label class="field-label" for="detectedStyle">🎸 DETECTED MUSIC STYLE (Suno Style Prompt):</label>
        <textarea id="detectedStyle" class="style-box" placeholder="गाना अपलोड करके Auto-Detect दबाने पर म्यूज़िक स्टाइल यहाँ आ जाएगा..."></textarea>
        <button class="btn btn-copy" style="margin-bottom: 14px;" onclick="copyText('detectedStyle', 'copyStyleBtn')" id="copyStyleBtn">📋 COPY MUSIC STYLE</button>

        <label class="field-label" for="inputLyrics">> यहाँ पे लिरिक्स डालें:</label>
        <textarea id="inputLyrics" placeholder="यहाँ हिंदी, उड़िया या इंग्लिश लिरिक्स लिखें या पेस्ट करें..."></textarea>

        <button class="btn btn-gen" onclick="generateBypass()">⚡ RE-GENERATE NEW BYPASS</button>

        <label class="field-label" for="outputLyrics">// BYPASS GENERATED //</label>
        <textarea id="outputLyrics" readonly placeholder="बदलते हुए लिरिक्स यहाँ दिखेंगे..."></textarea>

        <button class="btn btn-copy" onclick="copyText('outputLyrics', 'copyLyricsBtn')" id="copyLyricsBtn">📋 COPY ENCRYPTED LYRICS</button>
    </div>
</div>

<script>
    let currentFile = null;
    let blobUrl = null;
    let isProcessing = false;

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_studio_key');
        if (savedKey) document.getElementById('geminiKeyInput').value = savedKey;
    });

    function saveApiKey() {
        const key = document.getElementById('geminiKeyInput').value.trim();
        if (!key) { alert("कृपया पहले Gemini API Key डालें!"); return; }
        localStorage.setItem('gemini_studio_key', key);
        const btn = document.getElementById('saveKeyBtn');
        btn.innerText = "SAVED ✓";
        setTimeout(() => btn.innerText = "SAVE", 2000);
    }

    function switchTab(tab) {
        document.getElementById('audioSection').classList.toggle('active', tab === 'audio');
        document.getElementById('lyricsSection').classList.toggle('active', tab === 'lyrics');
        document.getElementById('tabAudioBtn').classList.toggle('active', tab === 'audio');
        document.getElementById('tabLyricsBtn').classList.toggle('active', tab === 'lyrics');
    }

    document.getElementById('audioInput').addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            currentFile = e.target.files[0];
            const sizeMB = (currentFile.size / (1024 * 1024)).toFixed(2);
            document.getElementById('fileTitle').innerText = currentFile.name;
            document.getElementById('fileSub').innerText = `Ready • ${sizeMB} MB`;
            
            document.getElementById('btnFilter1').disabled = false;
            document.getElementById('btnFilter2').disabled = false;
            document.getElementById('detectBtn').disabled = false;
            
            document.getElementById('btnFilter1').classList.remove('active-run');
            document.getElementById('btnFilter2').classList.remove('active-run');
            document.getElementById('dlBtn').style.display = 'none';
            document.getElementById('player').style.display = 'none';
            document.getElementById('statusBox').innerText = "✅ फ़ाइल तैयार है! Filter #1 या #2 पर टच करें।";
        }
    });

    // --- V6 ANTI-FINGERPRINT DSP ENGINE (Breaks Chromaprint & Spectral Hash) ---
    async function runAutoPipeline(filterNum) {
        if (!currentFile || isProcessing) return;

        isProcessing = true;
        const btn1 = document.getElementById('btnFilter1');
        const btn2 = document.getElementById('btnFilter2');
        const status = document.getElementById('statusBox');

        btn1.disabled = true;
        btn2.disabled = true;
        btn1.classList.toggle('active-run', filterNum === 1);
        btn2.classList.toggle('active-run', filterNum === 2);

        status.innerText = `⏳ V6 Spectral Bypass #${filterNum} चल रहा है...`;

        await new Promise(r => setTimeout(r, 80));

        try {
            const arrayBuf = await currentFile.arrayBuffer();
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            const tempCtx = new AudioContextClass();
            const rawAudioBuf = await tempCtx.decodeAudioData(arrayBuf);
            if (tempCtx.close) await tempCtx.close();

            // Step 1: Pre-process buffer (Mid-Side Vocal Isolation + Micro-Jitter Time Warp)
            // This breaks exact beat-grid & stereo instrumental fingerprint while keeping vocals crisp!
            const processedSourceBuf = applyMicroJitterAndVocalFocus(rawAudioBuf, filterNum);

            const isFilter1 = (filterNum === 1);
            // Filter #1: +8.5% tempo & +65 cents pitch (escapes +/-5% fingerprint window cleanly)
            // Filter #2: -9.5% tempo & -135 cents pitch (deep key shift + formant masking)
            const rate = isFilter1 ? 1.085 : 0.905;
            const detuneCents = isFilter1 ? 65 : -135;

            const maxAllowedSec = 480;
            const effectiveDuration = Math.min(processedSourceBuf.duration, maxAllowedSec);
            const outDurationSec = effectiveDuration / rate;

            // Adaptive Sample Rate (~8.5 - 9.8 MB output)
            const targetMaxBytes = 9.5 * 1024 * 1024;
            const computedRate = Math.floor((targetMaxBytes / 2) / outDurationSec);
            const finalSampleRate = Math.min(22050, Math.max(12000, computedRate));
            const outLength = Math.floor(outDurationSec * finalSampleRate);

            const offlineCtx = new OfflineAudioContext(1, outLength, finalSampleRate);

            const source = offlineCtx.createBufferSource();
            source.buffer = processedSourceBuf;
            source.playbackRate.value = rate;
            source.detune.value = detuneCents;

            // Step 2: Dual Cascaded Allpass Phase Dispersers (Scrambles phase spectrum completely without altering audible melody)
            const allpass1 = offlineCtx.createBiquadFilter();
            allpass1.type = "allpass";
            allpass1.frequency.value = isFilter1 ? 620 : 480;
            allpass1.Q.value = 3.5;

            const allpass2 = offlineCtx.createBiquadFilter();
            allpass2.type = "allpass";
            allpass2.frequency.value = isFilter1 ? 2100 : 1750;
            allpass2.Q.value = 4.0;

            // Step 3: Dynamic LFO Swept Peaking Resonator (Breaks Mel-Spectrogram peaks)
            const dynamicPeak = offlineCtx.createBiquadFilter();
            dynamicPeak.type = "peaking";
            dynamicPeak.frequency.value = isFilter1 ? 1400 : 1150;
            dynamicPeak.Q.value = isFilter1 ? 2.2 : 3.0;
            dynamicPeak.gain.value = isFilter1 ? 4.5 : 6.0;

            const lfo = offlineCtx.createOscillator();
            const lfoGain = offlineCtx.createGain();
            lfo.type = "triangle";
            lfo.frequency.value = isFilter1 ? 0.65 : 1.15;
            lfoGain.gain.value = isFilter1 ? 650 : 950;
            lfo.connect(lfoGain);
            lfoGain.connect(dynamicPeak.frequency);
            lfo.start(0);

            // Step 4: Vocal Clarity & Presence Shaping
            const vocalBoost = offlineCtx.createBiquadFilter();
            vocalBoost.type = "peaking";
            vocalBoost.frequency.value = 2850;
            vocalBoost.Q.value = 1.4;
            vocalBoost.gain.value = 3.2;

            // Step 5: Subtle Non-Linear Waveshaper (Alters harmonic ratios)
            const shaper = offlineCtx.createWaveShaper();
            shaper.curve = makeSoftCurve(isFilter1 ? 8 : 16);

            // Connect DSP Chain
            source.connect(allpass1);
            allpass1.connect(allpass2);
            allpass2.connect(dynamicPeak);
            dynamicPeak.connect(vocalBoost);
            vocalBoost.connect(shaper);
            shaper.connect(offlineCtx.destination);

            source.start(0, 0, effectiveDuration);
            status.innerText = `⚙️ Spectral Scrambler & 0 dBFS रेंडर हो रहा है...`;

            const rendered = await offlineCtx.startRendering();
            normalizeToZeroDBFS(rendered);
            const wavBlob = encodeWAV(rendered);

            const outSizeMB = (wavBlob.size / (1024 * 1024)).toFixed(2);

            if (blobUrl) URL.revokeObjectURL(blobUrl);
            blobUrl = URL.createObjectURL(wavBlob);

            const player = document.getElementById('player');
            player.src = blobUrl;
            player.style.display = 'block';

            const randNum = Math.floor(100000 + Math.random() * 900000);
            const finalFileName = `ManojV6_F${filterNum}_${randNum}.wav`;

            const dlBtn = document.getElementById('dlBtn');
            dlBtn.href = blobUrl;
            dlBtn.download = finalFileName;
            dlBtn.innerText = `⬇️ दोबारा डाउनलोड करें (${outSizeMB} MB)`;
            dlBtn.style.display = 'block';

            const autoLink = document.createElement('a');
            autoLink.href = blobUrl;
            autoLink.download = finalFileName;
            document.body.appendChild(autoLink);
            autoLink.click();
            document.body.removeChild(autoLink);

            status.innerText = `✅ V6 Bypass #${filterNum} तैयार! (${outSizeMB} MB) डाउनलोड हो गया।`;
        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: ऑडियो फ़ाइल प्रोसेस नहीं हो पाई, दोबारा ट्राई करें।";
        } finally {
            isProcessing = false;
            btn1.disabled = false;
            btn2.disabled = false;
        }
    }

    // Breaks Beat-Grid Hash via imperceptible micro-time warps & suppresses stereo backing fingerprint
    function applyMicroJitterAndVocalFocus(audioBuf, filterNum) {
        const sr = audioBuf.sampleRate;
        const len = audioBuf.length;
        const isStereo = audioBuf.numberOfChannels >= 2;
        const left = audioBuf.getChannelData(0);
        const right = isStereo ? audioBuf.getChannelData(1) : left;

        const outBuf = new AudioBuffer({ length: len, numberOfChannels: 1, sampleRate: sr });
        const out = outBuf.getChannelData(0);

        // Micro time-warp modulation (shifts sample read pointer smoothly by +/- 3ms every ~0.8s)
        // Completely destroys landmark-based audio fingerprinting while sounding completely smooth!
        const jitterDepthSamples = Math.floor(sr * (filterNum === 1 ? 0.0025 : 0.0045));
        const jitterFreq = filterNum === 1 ? 1.4 : 2.3;

        for (let i = 0; i < len; i++) {
            // Suppress stereo side-channel slightly (reduces background instrumental match, keeps center vocal strong)
            const mid = (left[i] + right[i]) * 0.5;
            const side = (left[i] - right[i]) * 0.5;
            const vocalFocused = mid + side * (filterNum === 1 ? 0.35 : 0.15);

            // Smooth sinusoidal time-pointer drift
            const offset = Math.sin((2 * Math.PI * jitterFreq * i) / sr) * jitterDepthSamples;
            const readIdx = Math.min(len - 2, Math.max(0, i + offset));
            const idx0 = Math.floor(readIdx);
            const frac = readIdx - idx0;

            // Linear interpolation for clean zero-click audio
            const s0 = isStereo ? ((left[idx0] + right[idx0]) * 0.5 + (left[idx0] - right[idx0]) * 0.5 * (filterNum === 1 ? 0.35 : 0.15)) : left[idx0];
            const s1 = isStereo ? ((left[idx0 + 1] + right[idx0 + 1]) * 0.5 + (left[idx0 + 1] - right[idx0 + 1]) * 0.5 * (filterNum === 1 ? 0.35 : 0.15)) : left[idx0 + 1];

            out[i] = s0 + frac * (s1 - s0);
        }
        return outBuf;
    }

    function makeSoftCurve(amount) {
        const n = 44100;
        const curve = new Float32Array(n);
        const deg = Math.PI / 180;
        for (let i = 0; i < n; ++i) {
            const x = (i * 2) / n - 1;
            curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
        }
        return curve;
    }

    function normalizeToZeroDBFS(audioBuffer) {
        let maxPeak = 0;
        const numChannels = audioBuffer.numberOfChannels;
        for (let c = 0; c < numChannels; c++) {
            const data = audioBuffer.getChannelData(c);
            for (let i = 0; i < data.length; i++) {
                const abs = Math.abs(data[i]);
                if (abs > maxPeak) maxPeak = abs;
            }
        }
        if (maxPeak > 0 && maxPeak < 0.99) {
            const multiplier = 0.99 / maxPeak;
            for (let c = 0; c < numChannels; c++) {
                const data = audioBuffer.getChannelData(c);
                for (let i = 0; i < data.length; i++) {
                    data[i] *= multiplier;
                }
            }
        }
    }

    function encodeWAV(abuffer) {
        const numChan = abuffer.numberOfChannels;
        const len = abuffer.length * numChan * 2 + 44;
        const buf = new ArrayBuffer(len);
        const view = new DataView(buf);
        const chans = [];
        let i, sample, offset = 0, pos = 0;

        const u16 = d => { view.setUint16(pos, d, true); pos += 2; };
        const u32 = d => { view.setUint32(pos, d, true); pos += 4; };

        u32(0x46464952); u32(len - 8); u32(0x45564157);
        u32(0x20746d66); u32(16); u16(1); u16(numChan);
        u32(abuffer.sampleRate); u32(abuffer.sampleRate * 2 * numChan);
        u16(numChan * 2); u16(16);
        u32(0x61746164); u32(len - pos - 4);

        for (i = 0; i < numChan; i++) chans.push(abuffer.getChannelData(i));

        while (pos < len) {
            for (i = 0; i < numChan; i++) {
                sample = Math.max(-1, Math.min(1, chans[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([buf], { type: "audio/wav" });
    }

    // --- AUTO DETECT STYLE & LYRICS ---
    async function autoDetectSong() {
        if (!currentFile) return;

        const apiKey = localStorage.getItem('gemini_studio_key') || document.getElementById('geminiKeyInput').value.trim();
        if (!apiKey) {
            alert("Auto-Detect के लिए ऊपर बॉक्स में Gemini API Key डालकर SAVE दबाएं!");
            return;
        }

        if (currentFile.size > 16 * 1024 * 1024) {
            alert("फ़ाइल 16 MB से बड़ी है। कृपया छोटी ऑडियो क्लिप चुनें।");
            return;
        }

        const detectBtn = document.getElementById('detectBtn');
        const status = document.getElementById('statusBox');
        detectBtn.disabled = true;
        status.innerText = "🤖 AI गाने का स्टाइल और लिरिक्स निकाल रहा है...";

        try {
            const base64Audio = await fileToBase64(currentFile);
            const mimeType = currentFile.type || "audio/mp3";

            const promptText = `Listen to this audio carefully and return ONLY valid JSON with two keys:
1. "style": A concise Suno AI music style prompt in English (include genre, regional vibe like Odia/Sambalpuri/Hindi/Bollywood if applicable, tempo, instruments, and vocal gender/tone, max 180 characters).
2. "lyrics": The exact transcribed lyrics of the song in its original script (Devanagari for Hindi, Odia script for Odia/Sambalpuri, or English) formatted neatly with [Verse], [Chorus] tags.

Return strictly JSON without markdown backticks.`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: mimeType, data: base64Audio } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message || "API Error");

            let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

            const parsed = JSON.parse(rawText);
            document.getElementById('detectedStyle').value = parsed.style || "";
            document.getElementById('inputLyrics').value = parsed.lyrics || "";

            if (parsed.lyrics) generateBypass();

            status.innerText = "✅ स्टाइल और बायपास लिरिक्स तैयार हैं!";
            setTimeout(() => switchTab('lyrics'), 500);

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: " + (err.message || "API Key या ऑडियो चेक करें।");
        } finally {
            detectBtn.disabled = false;
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // --- JP DIGITAL STYLE HEAVY LYRICS BYPASS ENGINE (Works on Hindi, Odia & Roman/English) ---
    function generateBypass() {
        const input = document.getElementById('inputLyrics').value;
        if (!input.trim()) return;

        // Zero-width joiners & word joiners to split tokens
        const invisibles = ['\u200B', '\u200C', '\u2060', '\uFEFF'];
        // JP Digital style ring/dot diacritics (top & bottom rings + dots)
        const jpMarks = ['\u030A', '\u0325', '\u0323', '\u0307', '\u0324'];

        let result = '';
        const lines = input.split('\n');

        for (let l = 0; l < lines.length; l++) {
            const line = lines[l];
            // Keep [Verse], [Chorus] tags untouched
            if (line.trim().startsWith('[') && line.trim().endsWith(']')) {
                result += line + '\n';
                continue;
            }

            const segmenter = new Intl.Segmenter('hi', { granularity: 'grapheme' });
            const segments = Array.from(segmenter.segment(line)).map(s => s.segment);

            for (let i = 0; i < segments.length; i++) {
                const char = segments[i];
                if (char.trim() === '' || /[.,!?'"\-*()0-9]/.test(char)) {
                    result += char;
                    continue;
                }

                const randInv = invisibles[Math.floor(Math.random() * invisibles.length)];
                // Heavy JP Digital density: ~85% characters get ring/dot diacritics + zero-width token splitter
                if (Math.random() > 0.15) {
                    const randMark = jpMarks[Math.floor(Math.random() * jpMarks.length)];
                    result += char + randMark + randInv;
                } else {
                    result += char + randInv;
                }
            }
            if (l < lines.length - 1) result += '\n';
        }

        document.getElementById('outputLyrics').value = result;
    }

    function copyText(elementId, btnId) {
        const output = document.getElementById(elementId);
        if (!output.value) return;
        
        output.select();
        output.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(output.value);

        const btn = document.getElementById(btnId);
        const oldText = btn.innerText;
        btn.innerText = "✅ COPIED!";
        setTimeout(() => { btn.innerText = oldText; }, 2000);
    }
